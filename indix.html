<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>مساعد ذكي خاص بي</title>
</head>
<body>
    <div style="max-width: 500px; margin: 50px auto; font-family: Arial;">
        <div id="chat-box" style="border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px;"></div>
        <input type="text" id="user-input" placeholder="كتب سؤالك هنا..." style="width: 75%; padding: 10px;">
        <button onclick="askAI()" style="width: 20%; padding: 10px;">سيفط</button>
    </div>

    <script>
        async function askAI() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const question = input.value;
            if (!question) return;

            // إظهار سؤال المستخدم فـ الشاشات
            chatBox.innerHTML += `<div><b>انت:</b> ${question}</div>`;
            input.value = '';

            try {
                // إرسال السؤال للسيرفر ديالنا
                const res = await fetch('http://localhost:3000/api/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });
                const data = await res.json();

                // إظهار جواب الـ AI
                chatBox.innerHTML += `<div><b>الذكاء الاصطناعي:</b> ${data.answer}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                chatBox.innerHTML += `<div style="color: red;">خطأ فالاتصال بالسيرفر</div>`;
            }
        }
    </script>
</body>
</html>
